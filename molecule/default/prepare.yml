---
- name: Prepare Headscale Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Headscale Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Headscale Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Headscale Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs

    - name: Ensure Headscale Molecule Docker health-gate wrapper is installed
      ansible.builtin.copy:
        dest: "{{ headscale_molecule_docker_wrapper }}"
        mode: "0755"
        content: |
          #!/bin/sh
          # SPDX-FileCopyrightText: 2026 MASH project contributors
          # SPDX-License-Identifier: AGPL-3.0-or-later

          set -eu

          if [ "$#" -eq 4 ] && [ "$1" = "exec" ] && [ "$2" = "headscale" ] && [ "$3" = "headscale" ] && [ "$4" = "health" ]; then
            health_mode=pass
            if [ -f "{{ headscale_molecule_health_mode_path }}" ]; then
              IFS= read -r health_mode < "{{ headscale_molecule_health_mode_path }}"
            fi
            if [ "$health_mode" = "block" ]; then
              exit 1
            fi
          fi

          exec /usr/bin/docker "$@"

    - name: Allow native Headscale health checks by default in Molecule
      ansible.builtin.copy:
        dest: "{{ headscale_molecule_health_mode_path }}"
        mode: "0644"
        content: "pass\n"

    # Nothing else needs seeding here: unlike applications that own their own
    # configuration file, this role templates Headscale's `config.yaml` in
    # full, and Headscale creates its SQLite database and its Noise/DERP
    # private keys by itself on first start.
