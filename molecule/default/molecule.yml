---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: headscale-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        headscale_debug_service_enabled: false
        headscale_molecule_docker_wrapper: /usr/local/bin/headscale-molecule-docker
        headscale_molecule_health_mode_path: /tmp/headscale-molecule-health-mode

        # The port on the test host that Headscale's HTTP API is published on.
        # The role does not publish it by default (Headscale is meant to be
        # reached through a reverse-proxy), so the scenario asks for it below.
        headscale_molecule_api_bind_port: 8080

        # The port on the test host that Headscale's Prometheus metrics are
        # published on. Also not published by the role by default.
        headscale_molecule_metrics_bind_port: 9090

        # Variables for Headscale
        headscale_uid: 1000
        headscale_gid: 1000
        headscale_hostname: headscale.molecule.test
        headscale_container_labels_traefik_enabled: false
        devture_systemd_docker_base_host_command_docker: "{{ headscale_molecule_docker_wrapper }}"

        # Pinned to a literal value, because `verify.yml` invokes the
        # `headscale` CLI wrapper that this role installs underneath it, and
        # cannot resolve the role's own default (which derives from
        # `headscale_identifier`).
        headscale_base_path: /headscale

        headscale_container_http_api_bind_port: "127.0.0.1:{{ headscale_molecule_api_bind_port }}"
        headscale_container_http_metrics_bind_port: "127.0.0.1:{{ headscale_molecule_metrics_bind_port }}"

        # Headscale (>= 0.29) refuses to start when it ends up with an empty
        # DERP map: `initial DERPMap is empty, Headscale requires at least one
        # entry`. The role's defaults fill it from Tailscale's published DERP
        # map over the internet, which would make this scenario depend on
        # reaching controlplane.tailscale.com.
        #
        # Running the embedded DERP server instead keeps the scenario
        # self-contained and exercises a feature of this role: with it enabled,
        # Headscale serves a DERP endpoint of its own (probed in `verify.yml`),
        # and it answers with a 404 when it is not.
        headscale_config_derp_server_enabled: true
        headscale_config_derp_server_urls: []
        headscale_config_derp_server_auto_update_enabled: false

        # Headscale checks for its own updates on startup otherwise, which is
        # another reach for the internet that this scenario does not need.
        headscale_config_disable_check_updates: true
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
