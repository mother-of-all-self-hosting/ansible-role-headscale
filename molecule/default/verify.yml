---
- name: Verify Headscale
  hosts: all
  become: true
  gather_facts: false

  vars:
    # The CLI wrapper that this role installs. It runs `headscale` inside the
    # container, talking to the running daemon over the UNIX socket, so every
    # command below goes through both the wrapper and the daemon.
    headscale_molecule_cli: "{{ headscale_base_path }}/bin/headscale"
    headscale_molecule_api_url: "http://127.0.0.1:{{ headscale_molecule_api_bind_port }}"
    headscale_molecule_metrics_url: "http://127.0.0.1:{{ headscale_molecule_metrics_bind_port }}"
    headscale_molecule_user_name: molecule

    headscale_verify_units:
      - headscale.service

  tasks:
    - name: Verify that Headscale works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: headscale_defaults

        - name: Wait for the Headscale systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: headscale_services
          until: headscale_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ headscale_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Headscale systemd services are active
          ansible.builtin.assert:
            that: headscale_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(headscale_verify_units | zip(headscale_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Inspect the Headscale container
          ansible.builtin.command:
            argv:
              - docker
              - container
              - inspect
              - "{{ headscale_defaults.headscale_identifier }}"
          register: headscale_container_inspect
          changed_when: false

        - name: Assert configured TCP and UDP ports are published
          vars:
            headscale_molecule_published_ports: >-
              {{ (headscale_container_inspect.stdout | from_json)[0].NetworkSettings.Ports }}
          ansible.builtin.assert:
            that:
              - >-
                headscale_molecule_published_ports.get(item.container_port)
                == [{'HostIp': '127.0.0.1', 'HostPort': item.host_port | string}]
            fail_msg: "Headscale container port publication does not match the configured listener contract"
            success_msg: "Headscale publishes {{ item.container_port }} on the configured host address and port"
          loop:
            - container_port: "{{ headscale_container_http_api_port }}/tcp"
              host_port: "{{ headscale_molecule_api_bind_port }}"
            - container_port: "{{ headscale_container_http_metrics_port }}/tcp"
              host_port: "{{ headscale_molecule_metrics_bind_port }}"
            - container_port: "{{ headscale_container_grpc_port }}/tcp"
              host_port: "{{ headscale_molecule_grpc_bind_port }}"
            - container_port: "{{ headscale_container_derp_stun_port }}/udp"
              host_port: "{{ headscale_molecule_derp_stun_bind_port }}"
          loop_control:
            label: "{{ item.container_port }}"

        - name: Assert embedded DERP STUN bind port is empty by default
          ansible.builtin.assert:
            that: headscale_defaults.headscale_container_derp_stun_bind_port == ''
            fail_msg: "Embedded DERP STUN bind port should be empty by default"
            success_msg: "Embedded DERP STUN bind port is empty by default"

        - name: Exercise embedded DERP STUN publication validation
          vars:
            headscale_identifier: headscale
            headscale_uid: 1000
            headscale_gid: 1000
            headscale_hostname: headscale.molecule.test
            headscale_path_prefix: /
            headscale_container_network: headscale
            headscale_container_labels_traefik_enabled: false
            headscale_config_database_type: sqlite
            headscale_config_log_format: text
            headscale_config_dns_magic_dns: true
            headscale_config_dns_base_domain: magic.headscale.molecule.test
            headscale_config_oidc_enabled: false
          block:
            # Existing deployments could already enable the embedded DERP server
            # and choose a non-default listener without publishing it through
            # Docker. The new opt-in settings must not invalidate that setup.
            - name: Validate a custom unpublished embedded DERP STUN listener
              ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate_config.yml"
              vars:
                headscale_config_derp_server_enabled: true
                headscale_config_derp_server_stun_listen_addr: "0.0.0.0:13480"
                headscale_container_derp_stun_bind_port: ""
                headscale_container_derp_stun_port: 3478

            - name: Reject a malformed published embedded DERP STUN listener
              block:
                - name: Validate a malformed published embedded DERP STUN listener
                  ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate_config.yml"
                  vars:
                    headscale_config_derp_server_enabled: true
                    headscale_config_derp_server_stun_listen_addr: "3478"
                    headscale_container_derp_stun_bind_port: 3478
                    headscale_container_derp_stun_port: 3478

                - name: Fail because the malformed listener was accepted
                  ansible.builtin.fail:
                    msg: Malformed published embedded DERP STUN listener was unexpectedly accepted
              rescue:
                - name: Assert the listener format check caused the failure
                  ansible.builtin.assert:
                    that: "'must use a valid host:port value' in ansible_failed_result.msg"

        - name: Retrieve the Headscale systemd services log for debugging
          when: headscale_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ headscale_verify_units }}"

        # Headscale's own health endpoint. It only starts serving once the
        # configuration has loaded, the database is open and the DERP map is
        # non-empty - a Headscale that fails any of those exits instead of
        # answering here.
        - name: Wait for the Headscale health endpoint to pass (up to 180s)
          ansible.builtin.uri:
            url: "{{ headscale_molecule_api_url }}/health"
            method: GET
            return_content: true
          register: headscale_health
          until: headscale_health.status == 200
          retries: 36
          delay: 5
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # Parsed from the raw body rather than relying on `.json`, because
        # Headscale answers with an `application/health+json` content type.
        - name: Assert Headscale reports itself healthy
          ansible.builtin.assert:
            that: (headscale_health.content | from_json).status == 'pass'
            fail_msg: "Headscale did not report itself healthy: {{ headscale_health.content | default('no response') }}"
            success_msg: "Headscale reports itself healthy"

        - name: Query the version of the running Headscale
          ansible.builtin.command:
            cmd: "{{ headscale_molecule_cli }} version --output json"
          register: headscale_version_result
          changed_when: false

        # Headscale reports its version with a leading `v` (`v0.107.79`), the
        # same way the role's version variable carries one. Any leading `v` is normalized
        # away on both sides, so that this keeps holding if either side ever changes.
        - name: Assert the running Headscale is the version this role installs
          ansible.builtin.assert:
            that: ((headscale_version_result.stdout | from_json).version | regex_replace('^v', '')) == (headscale_defaults.headscale_version | regex_replace('^v', ''))
            fail_msg: "Headscale reports {{ (headscale_version_result.stdout | from_json).version | default('none') }}, expected {{ headscale_defaults.headscale_version }}"
            success_msg: "Headscale reports {{ (headscale_version_result.stdout | from_json).version }}"

        # A second listener, on a second published port, that only exists because
        # the role templated `metrics_listen_addr` and asked for the port to be
        # published. The metric asserted on is one of Headscale's own, so a
        # different application answering here would not satisfy it.
        - name: Query the Headscale metrics endpoint
          ansible.builtin.uri:
            url: "{{ headscale_molecule_metrics_url }}/metrics"
            method: GET
            return_content: true
          register: headscale_metrics

        - name: Assert Headscale exposes its own metrics
          ansible.builtin.assert:
            that: "'headscale_nodestore_nodes' in headscale_metrics.content"
            fail_msg: "The metrics endpoint does not look like Headscale's"
            success_msg: "Headscale exposes its own metrics"

        # The embedded DERP server that the scenario turned on. Headscale only
        # registers this handler when `derp.server.enabled` is true - with the
        # role's default of false it answers 404 here - so this is a real check of
        # `headscale_config_derp_server_enabled` reaching the running daemon.
        - name: Probe the Headscale embedded DERP server
          ansible.builtin.uri:
            url: "{{ headscale_molecule_api_url }}/derp/probe"
            method: GET
            status_code: 200
          register: headscale_derp_probe

        - name: Assert the Headscale embedded DERP server answers
          ansible.builtin.assert:
            that: headscale_derp_probe.status == 200
            fail_msg: "The embedded DERP server did not answer (HTTP {{ headscale_derp_probe.status }})"
            success_msg: "The embedded DERP server answers"

        # Headscale deliberately accepts only Tailscale STUN requests. Build the
        # same SOFTWARE and FINGERPRINT attributes as tailscale.com's stun.Request.
        - name: Query the published embedded DERP STUN listener
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import secrets
                import socket
                import struct
                import zlib

                transaction_id = secrets.token_bytes(12)
                software_attribute = struct.pack("!HH8s", 0x8022, 8, b"tailnode")
                request_without_fingerprint = (
                    struct.pack("!HHI12s", 0x0001, 20, 0x2112A442, transaction_id)
                    + software_attribute
                )
                fingerprint = (zlib.crc32(request_without_fingerprint) & 0xFFFFFFFF) ^ 0x5354554E
                request = request_without_fingerprint + struct.pack("!HHI", 0x8028, 4, fingerprint)
                with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                    sock.settimeout(5)
                    sock.sendto(request, ("127.0.0.1", {{ headscale_molecule_derp_stun_bind_port }}))
                    response, _ = sock.recvfrom(2048)

                message_type, _, cookie, response_transaction_id = struct.unpack("!HHI12s", response[:20])
                if message_type != 0x0101 or cookie != 0x2112A442 or response_transaction_id != transaction_id:
                    raise SystemExit("invalid STUN binding response")
          changed_when: false

        # From here on the daemon is asked to actually do something: create a user,
        # issue it a pre-auth key, and read both back. Each of these is a round
        # trip through the CLI wrapper, the UNIX socket, the gRPC handlers and the
        # SQLite database that the role mounted into the container.
        - name: Create a Headscale user
          ansible.builtin.command:
            cmd: >-
              {{ headscale_molecule_cli }}
              users create {{ headscale_molecule_user_name }}
              --output json
          register: headscale_user_create
          changed_when: headscale_user_create.rc == 0
          # `molecule test` always starts from an empty database, but a standalone
          # `molecule verify` re-run finds the user already there. Its absence is
          # what the next task asserts on, so tolerating this does not weaken it.
          failed_when: >-
            headscale_user_create.rc != 0
            and 'UNIQUE constraint failed: users.name' not in (headscale_user_create.stdout + headscale_user_create.stderr)

        - name: List Headscale users
          ansible.builtin.command:
            cmd: >-
              {{ headscale_molecule_cli }}
              users list
              --output json
          register: headscale_users_list
          changed_when: false

        - name: Assert the created user is stored by Headscale
          vars:
            headscale_molecule_users: "{{ headscale_users_list.stdout | from_json | default([], true) }}"
          ansible.builtin.assert:
            that: headscale_molecule_user_name in (headscale_molecule_users | map(attribute='name') | list)
            fail_msg: "Headscale does not know about the '{{ headscale_molecule_user_name }}' user: {{ headscale_users_list.stdout }}"
            success_msg: "Headscale stored the '{{ headscale_molecule_user_name }}' user"

        # `headscale preauthkeys` identifies users by their numeric ID rather than
        # by name, so it has to be read back out of the listing.
        - name: Determine the Headscale user identifier
          ansible.builtin.set_fact:
            headscale_molecule_user_id: "{{ (headscale_users_list.stdout | from_json | selectattr('name', 'equalto', headscale_molecule_user_name) | map(attribute='id') | first) | int }}"

        - name: Create a Headscale pre-auth key for the user
          ansible.builtin.command:
            cmd: >-
              {{ headscale_molecule_cli }}
              preauthkeys create
              --user {{ headscale_molecule_user_id }}
              --expiration 1h
              --output json
          register: headscale_preauthkey_create
          changed_when: headscale_preauthkey_create.rc == 0

        - name: Assert Headscale issued a pre-auth key
          vars:
            headscale_molecule_preauthkey: "{{ headscale_preauthkey_create.stdout | from_json }}"
          ansible.builtin.assert:
            that:
              - headscale_molecule_preauthkey.key.startswith('hskey-auth-')
              - headscale_molecule_preauthkey.user.name == headscale_molecule_user_name
            fail_msg: "Headscale did not issue a usable pre-auth key: {{ headscale_preauthkey_create.stdout }}"
            success_msg: "Headscale issued a pre-auth key for '{{ headscale_molecule_user_name }}'"

        - name: List Headscale pre-auth keys
          ansible.builtin.command:
            cmd: >-
              {{ headscale_molecule_cli }}
              preauthkeys list
              --output json
          register: headscale_preauthkeys_list
          changed_when: false

        # Read back through a separate command, so that the key is known to have
        # been persisted rather than merely reported by the call that made it.
        # `preauthkeys list` masks the key material, hence the match on the ID.
        - name: Assert the pre-auth key is stored by Headscale
          vars:
            headscale_molecule_created_key_id: "{{ (headscale_preauthkey_create.stdout | from_json).id | int }}"
            headscale_molecule_stored_keys: "{{ headscale_preauthkeys_list.stdout | from_json | default([], true) | selectattr('user.name', 'equalto', headscale_molecule_user_name) | map(attribute='id') | map('int') | list }}"
          ansible.builtin.assert:
            that: (headscale_molecule_created_key_id | int) in (headscale_molecule_stored_keys | map('int') | list)
            fail_msg: "Pre-auth key {{ headscale_molecule_created_key_id }} is not stored: {{ headscale_preauthkeys_list.stdout }}"
            success_msg: "Headscale stored pre-auth key {{ headscale_molecule_created_key_id }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "headscale_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: headscale_restarts_before
              loop: "{{ headscale_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: headscale_restarts_after
              loop: "{{ headscale_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - headscale_restarts_after.results | map(attribute='status.NRestarts') | list == headscale_restarts_before.results | map(attribute='status.NRestarts') | list
                  - headscale_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in headscale_verify_units | zip(headscale_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in headscale_verify_units | zip(headscale_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in headscale_verify_units | zip(headscale_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Headscale verification summary
          ansible.builtin.debug:
            msg:
              - "Headscale systemd: {% for unit, state in headscale_verify_units | zip(headscale_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Headscale restarts: {% for unit, restarts in headscale_verify_units | zip(headscale_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Headscale version: {{ (headscale_version_result.stdout | from_json).version }}"
              - "Headscale health: {{ (headscale_health.content | from_json).status }}"
              - "Headscale embedded DERP: HTTP {{ headscale_derp_probe.status }}"
              - "Headscale users: {{ headscale_users_list.stdout | from_json | map(attribute='name') | list }}"
              - "Headscale pre-auth keys: {{ headscale_preauthkeys_list.stdout | from_json | length }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Headscale systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=headscale.service
          register: headscale_service_log
          changed_when: false

        - name: Show the Headscale systemd service log
          ansible.builtin.debug:
            var: headscale_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Headscale verification failed. The systemd service log is printed above."
